<style>
  /* Layout: full-window 3D canvas, stats strip top-centre, sound / restart buttons top-right, minimap bottom-right,
     a touch stick wherever a finger goes down, centred card for title / caught / escaped */
  :root{
    --bg:#2a0a14; --ink:#1a0610; --card:rgba(30,8,18,.86); --text:#ffe9ef; --dim:#d7a3b3;
    --virus:#8be04e; --danger:#ff3b5c; --exit:#ff5a6e;
    --title:'Bungee', Verdana, sans-serif; --body:Verdana, Tahoma, sans-serif;
    --mm:clamp(96px, 28vmin, 186px);
    --st:env(safe-area-inset-top,0px); --sr:env(safe-area-inset-right,0px); --sb:env(safe-area-inset-bottom,0px); --sl:env(safe-area-inset-left,0px);
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--body);
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  /* Keyboard hints (.kb) or touch hints (.tc), whichever was used last */
  .tc{display:none}
  body.touch .tc{display:revert}
  body.touch .kb{display:none}

  #home{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));z-index:50;
    width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#2a2140;background:rgba(255,255,255,.82);
    box-shadow:0 3px 0 rgba(0,0,0,.18);touch-action:manipulation;-webkit-tap-highlight-color:transparent;text-decoration:none}
  #home svg{width:24px;height:24px}
  #home:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}

  /* Stats with the toast under them, between the home button and the tools */
  #top{position:fixed;top:calc(12px + var(--st));left:50%;transform:translateX(-50%);width:calc(100% - 136px - 2 * max(var(--sl), var(--sr)));
    display:flex;flex-direction:column;align-items:center;gap:12px;z-index:10;pointer-events:none}
  #hud{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 18px;padding:8px 18px;border-radius:22px;
    background:var(--card);font-size:15px;white-space:nowrap}
  #hud b{color:#fff}
  #tools{position:fixed;top:calc(10px + var(--st));right:calc(10px + var(--sr));z-index:30;display:flex;flex-direction:column;gap:8px}
  #tools button{width:44px;height:44px;border:0;border-radius:50%;padding:0;font-size:21px;line-height:1;cursor:pointer;
    background:rgba(255,255,255,.82);box-shadow:0 3px 0 rgba(0,0,0,.18);touch-action:manipulation}
  #tools button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
  #tools button[hidden]{display:none}
  #toast{font-family:var(--title);font-size:18px;color:var(--danger);text-align:center;
    text-shadow:0 2px 0 var(--ink);opacity:0;transition:opacity .3s}
  #toast.on{opacity:1}
  #help{position:fixed;left:calc(14px + var(--sl));bottom:calc(12px + var(--sb));max-width:calc(100% - var(--mm) - 56px - var(--sl) - var(--sr));
    font-size:12px;line-height:1.4;color:var(--dim);pointer-events:none;z-index:10}
  #minimap{position:fixed;right:calc(14px + var(--sr));bottom:calc(14px + var(--sb));width:var(--mm);height:var(--mm);border-radius:10px;
    background:rgba(0,0,0,.45);image-rendering:pixelated;z-index:10;pointer-events:none}
  /* Touch stick: appears where the finger goes down, the knob follows it */
  #stick{position:fixed;left:0;top:0;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;display:none;
    border:3px solid rgba(255,255,255,.35);background:rgba(255,255,255,.07);pointer-events:none;z-index:9}
  #stick.on{display:block}
  #knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;
    background:rgba(139,224,78,.55);box-shadow:0 0 18px rgba(139,224,78,.6)}
  @media (max-width:640px), (max-height:520px){
    #hud{font-size:13px;gap:3px 11px;padding:6px 12px}
    #hud .lbl{display:none}
    #toast{font-size:15px}
  }
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:4;
    background:radial-gradient(ellipse at 50% 55%, transparent 55%, rgba(20,0,8,.6) 100%)}
  #danger{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:5;
    box-shadow:inset 0 0 120px 30px var(--danger)}

  #overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(20,4,10,.45);z-index:20;
    padding:var(--st) var(--sr) var(--sb) var(--sl)}
  #overlay.hidden{display:none}
  #card{max-width:460px;max-height:calc(100% - 32px);overflow:auto;box-sizing:border-box;margin:16px;padding:26px 30px;border-radius:18px;
    background:var(--card);text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5);-webkit-user-select:text;user-select:text}
  #card h1{margin:0 0 10px;font-family:var(--title);font-weight:400;font-size:34px;color:var(--virus);text-shadow:0 3px 0 var(--ink)}
  #card h1.bad{color:var(--danger)}
  #card p{margin:8px 0;line-height:1.5}
  #card .credit{margin-top:14px;font-size:11px;color:var(--dim)}
  #card .key{display:inline-block;margin-top:10px;min-height:44px;padding:6px 18px;border:0;border-radius:10px;background:#fff;color:var(--ink);
    font:bold 16px var(--body);cursor:pointer;touch-action:manipulation}
  #card .key:active{transform:translateY(2px)}
  @media (max-width:520px), (max-height:520px){
    #card{padding:18px 20px}

    #card p{font-size:14px;line-height:1.4;margin:6px 0}
  }
  @media (max-height:520px){ #card{max-width:640px;max-height:calc(100% - 16px);margin:8px} }

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ======== tuning ======== */
const GRID = 31;                 // the level is GRID x GRID cells
const VIRUS_SPEED = 5;           // cells per second through open space
const CHEW_TIME = { 1: 0.4, 2: 1.0, 4: 0.2 };   // seconds to chew soft (1), dense (2) and fat (4) tissue
const AB_SPEED = 2.1;            // antibody cells per second on level 1
const AB_SPEED_PER_LEVEL = 0.15; // added each level
const AB_WANDER_FACTOR = 0.5;    // antibodies that can't sense the virus drift at this fraction of speed
const FIRST_WAVE_FRACTION = 0.5; // the first antibodies come in through your entry wound after this share of the
                                 // fastest possible escape time (the quickest route, chewing included)
const FIRST_WAVE_MIN = 10;       // ...but never sooner than this many seconds
const START_SOFT_RADIUS = 4;     // dense tissue and membranes this close to the entry wound become soft tissue
const WAVE_EVERY = 12;           // seconds between later arrivals
const TAP_BUFFER = 0.3;          // seconds a tapped direction is remembered until the next cell centre
const STICK_DEAD = 14;           // px a finger must drag before the touch stick picks a direction
const STICK_RADIUS = 48;         // px; dragging further pulls the stick along, so turning back is quick
const MIN_VIEW = 4.5;            // cells always visible either side of the virus: narrow (portrait) screens pull the camera back
const TOUCH_PIXEL_RATIO = 1.5;   // render resolution cap on touch devices (2 elsewhere), to keep phones smooth
const FAT_BLOBS = 3;             // fat pockets to hide in (+1 every second level)
const PICKUPS_IN_TISSUE = 5;     // power-ups sealed in little cavities
const PICKUPS_IN_VESSELS = 2;    // power-ups lying in the vessels, near the patrols
const ENZYME_CHEW = 0.3;         // chew time multiplier while Enzyme is active
const ATP_SPEED = 1.7;           // move speed multiplier while ATP is active
const ACID_SLOW = 0.45;          // move speed multiplier while wading through acid
const PATROLS = 2;               // antibodies already patrolling the vessels (+1 per level)
const MAX_ANTIBODIES = 10;
const CATCH_DIST = 0.55;         // cells
const VESSELS = 4;               // open blood vessels carved through the tissue
const MEMBRANES = 2;             // unchewable walls with gaps (+1 per level, up to 5)
const DENSE_THRESHOLD = 0.58;    // higher = less dense tissue

/* ======== grid ======== */
const OPEN = 0, SOFT = 1, DENSE = 2, WALL = 3, FAT = 4;
const N = GRID * GRID;
const type = new Uint8Array(N);
const chew = new Float32Array(N);       // 0..1 chew progress per cell
const height = new Float32Array(N);     // tissue block height
const vessel = new Uint8Array(N);       // 1 = blood vessel floor
const eaten = new Uint8Array(N);        // 1 = chewed by the virus
const fat = new Uint8Array(N);          // 1 = fat pocket: the virus is hidden while inside
const acid = new Uint8Array(N);         // 1 = acid pool (the Gut): open, but the virus wades through slowly
const pickupAt = new Map();             // cell index -> power-up
const dist = new Int32Array(N);         // BFS steps from the virus over open cells, -1 = no route
const bfsQueue = new Int32Array(N);
const idx = (x, z) => z * GRID + x;
const inside = (x, z) => x >= 0 && z >= 0 && x < GRID && z < GRID;
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const lerp = (a, b, t) => a + (b - a) * t;

let start, exit;   // {x,z}
let spawnCell;     // where trailing antibodies come in

function makeNoise(cell) {
  const w = Math.ceil(GRID / cell) + 2;
  const g = Array.from({ length: w * w }, Math.random);
  const s = t => t * t * (3 - 2 * t);
  return (x, z) => {
    const fx = x / cell, fz = z / cell, ix = Math.floor(fx), iz = Math.floor(fz);
    const tx = s(fx - ix), tz = s(fz - iz);
    const a = g[iz * w + ix], b = g[iz * w + ix + 1], c = g[(iz + 1) * w + ix], d = g[(iz + 1) * w + ix + 1];
    return lerp(lerp(a, b, tx), lerp(c, d, tx), tz);
  };
}

/* ======== organs: every level is a different part of the body ========
   Each theme sets the colours, the shape of the tissue cells, how the level is laid out and one special feature.
   After the sixth they repeat, with the usual per-level difficulty on top. */
const THEMES = [
  { key: 'muscle', name: 'The Muscle', icon: '💪', blurb: 'Springy pink muscle with blood vessels running through it.',
    layout: 'muscle', shape: 'box', nucleus: true, beat: 1,
    bg: 0x2a0a14, sky: 0xffd6e0, ground: 0x3a0c1c, soft: 0xe98a9c, dense: 0xa8455e, wall: 0x6d5a8a, fat: 0xf3d98a,
    nucleusCol: 0x8a2a6a, floor: 0x4a1a2a, lane: 0xa01a34, motes: 0xffb0c4 },
  { key: 'lungs', name: 'The Lungs', icon: '🫁', blurb: 'Big airy alveoli to dash through, but guards patrol every one.',
    layout: 'alveoli', shape: 'blob', nucleus: false, beat: 0.6, moteSize: 0.2,
    bg: 0x1c1430, sky: 0xe8f0ff, ground: 0x40283c, soft: 0xf4b8c8, dense: 0xd889a8, wall: 0x8a7ab0, fat: 0xfff0b0,
    floor: 0x5a3048, lane: 0xc86a90, motes: 0xdff0ff },
  { key: 'gut', name: 'The Gut', icon: '🍲', blurb: 'Wobbly villi and pools of stomach acid. Acid slows you down, but the guards wade right through.',
    layout: 'villi', shape: 'villus', nucleus: false, beat: 0.5, acid: true,
    bg: 0x1a1606, sky: 0xfff0c8, ground: 0x3a2a10, soft: 0xeaa478, dense: 0xc0704a, wall: 0x7a5a3a, fat: 0xf8e090,
    floor: 0x3a2412, lane: 0xa04a20, motes: 0xd8ff80 },
  { key: 'brain', name: 'The Brain', icon: '🧠', blurb: 'Folded grey matter crackling with nerve signals.',
    layout: 'folds', shape: 'fold', nucleus: false, beat: 0.4, sparks: true,
    bg: 0x0c0a22, sky: 0xc8d0ff, ground: 0x201040, soft: 0xd8b8c8, dense: 0x9a8098, wall: 0x4a3a8a, fat: 0xf0e0b0,
    floor: 0x24183a, lane: 0x6a3aa0, motes: 0x9ad0ff },
  { key: 'bone', name: 'The Bone', icon: '🦴', blurb: 'A hard bone honeycomb. Soft red marrow is quick to chew; the bone is not.',
    layout: 'marrow', shape: 'hex', nucleus: false, beat: 0.5,
    bg: 0x1a1612, sky: 0xfff8e8, ground: 0x302418, soft: 0xc84a4a, dense: 0xe8dcc0, wall: 0xa89878, fat: 0xf8e8a0,
    floor: 0x3a2a20, lane: 0x9a2a2a, motes: 0xfff0d8 },
  { key: 'heart', name: 'The Heart', icon: '❤️', blurb: 'Rings of thumping heart muscle around a great big chamber.',
    layout: 'rings', shape: 'fiber', nucleus: true, beat: 2.2,
    bg: 0x300408, sky: 0xffc8c8, ground: 0x400810, soft: 0xd84a5a, dense: 0x9a1a30, wall: 0x5a1a3a, fat: 0xf3d98a,
    nucleusCol: 0x5a0a2a, floor: 0x3a0810, lane: 0xc01020, motes: 0xff8090 },
];
let theme = THEMES[0];
const themeFor = level => THEMES[(level - 1) % THEMES.length];

const interior = (x, z) => x > 0 && z > 0 && x < GRID - 1 && z < GRID - 1;
function disc(cx, cz, r, fn) {
  for (let z = Math.floor(cz - r); z <= Math.ceil(cz + r); z++) for (let x = Math.floor(cx - r); x <= Math.ceil(cx + r); x++)
    if (interior(x, z) && Math.hypot(x - cx, z - cz) <= r) fn(idx(x, z), x, z);
}
// Blood vessels: random walks of open floor
function carveVessels(count) {
  for (let v = 0; v < count; v++) {
    let x = randi(3, GRID - 4), z = randi(3, GRID - 4);
    let [dx, dz] = DIRS[randi(0, 3)];
    const len = randi(18, 34);
    for (let s = 0; s < len; s++) {
      const i = idx(x, z);
      type[i] = OPEN; vessel[i] = 1; acid[i] = 0;
      if (Math.random() < 0.18) [dx, dz] = DIRS[randi(0, 3)];
      const nx = x + dx, nz = z + dz;
      if (!interior(nx, nz)) { [dx, dz] = DIRS[randi(0, 3)]; continue; }
      x = nx; z = nz;
    }
  }
}
// Membranes: straight unchewable walls with a couple of gaps
function membranes(count) {
  for (let m = 0; m < count; m++) {
    const horiz = Math.random() < 0.5;
    const at = randi(5, GRID - 6);
    const from = randi(1, 8), to = randi(GRID - 9, GRID - 2);
    const gaps = [randi(from, to), randi(from, to)];
    for (let k = from; k <= to; k++) {
      if (gaps.some(g => k >= g && k <= g + 1)) continue;
      const [x, z] = horiz ? [k, at] : [at, k];
      type[idx(x, z)] = WALL;
    }
  }
}

const LAYOUTS = {
  muscle(level) {
    membranes(Math.min(MEMBRANES + level - 1, 5));
    carveVessels(VESSELS);
  },
  // Round air sacs, already open, joined by thin tissue
  alveoli(level) {
    for (let k = 0; k < 11 + Math.min(level, 6); k++)
      disc(randi(4, GRID - 5), randi(4, GRID - 5), rand(1.5, 2.6), i => { type[i] = OPEN; vessel[i] = 1; });
    membranes(1 + Math.floor(level / 3));
    carveVessels(2);
  },
  // A field of tall villi pillars, with acid pools between them
  villi(level) {
    for (let z = 1; z < GRID - 1; z++) for (let x = 1; x < GRID - 1; x++)
      if (x % 3 === 1 && z % 3 === 1) type[idx(x, z)] = DENSE;
    for (let k = 0; k < 3 + Math.min(level, 4); k++)
      disc(randi(5, GRID - 6), randi(5, GRID - 6), rand(1.3, 2.3), i => { if (type[i] !== WALL) { type[i] = OPEN; acid[i] = 1; } });
    membranes(2);
    carveVessels(2);
  },
  // Wavy folds (unchewable) every few rows, lined with denser grey matter, with gaps to slip through
  folds() {
    for (let zc = 5; zc < GRID - 4; zc += 5) {
      const phase = rand(0, 6), amp = rand(1, 2);
      let prevZ = null, gap = randi(3, 9);
      for (let x = 1; x < GRID - 1; x++) {
        const z = Math.round(zc + Math.sin(x * 0.4 + phase) * amp);
        gap--;
        const inGap = gap <= 0;
        if (gap <= -2) gap = randi(6, 12);
        // Fill the vertical step from the previous column so the fold has no diagonal leaks
        const lo = Math.min(z, prevZ ?? z), hi = Math.max(z, prevZ ?? z);
        for (let zz = lo; zz <= hi; zz++) {
          if (!interior(x, zz)) continue;
          if (!inGap) type[idx(x, zz)] = WALL;
          for (const dz of [-1, 1]) if (interior(x, zz + dz) && type[idx(x, zz + dz)] === SOFT) type[idx(x, zz + dz)] = DENSE;
        }
        prevZ = z;
      }
    }
    carveVessels(3);
  },
  // Bone honeycomb: walls where two cells of the comb meet, soft marrow in the middle of each, hard bone between
  marrow() {
    const seeds = Array.from({ length: 12 }, () => [rand(2, GRID - 3), rand(2, GRID - 3)]);
    for (let z = 1; z < GRID - 1; z++) for (let x = 1; x < GRID - 1; x++) {
      const d = seeds.map(([sx, sz]) => Math.hypot(x - sx, z - sz)).sort((a, b) => a - b);
      const i = idx(x, z);
      if (d[1] - d[0] < 0.9) type[i] = Math.random() < 0.78 ? WALL : DENSE;
      else type[i] = d[0] < 2.3 ? SOFT : DENSE;
    }
    carveVessels(2);
  },
  // Rings of muscle round a central chamber, each ring with a few gaps, and fibres between them
  rings() {
    const c = (GRID - 1) / 2;
    const rings = [4.5, 8.5, 12.5].map(R => ({ R, gaps: Array.from({ length: randi(2, 3) }, () => rand(-Math.PI, Math.PI)) }));
    for (let z = 1; z < GRID - 1; z++) for (let x = 1; x < GRID - 1; x++) {
      const r = Math.hypot(x - c, z - c), a = Math.atan2(z - c, x - c), i = idx(x, z);
      if (type[i] === SOFT && Math.sin(a * 10 + r * 0.35) > 0.55) type[i] = DENSE;
      for (const { R, gaps } of rings) {
        if (Math.abs(r - R) >= 0.6) continue;
        const inGap = gaps.some(g => Math.abs(Math.atan2(Math.sin(a - g), Math.cos(a - g))) * R < 1.2);
        if (!inGap) type[i] = WALL;
      }
    }
    disc(c, c, 2.6, i => { type[i] = OPEN; vessel[i] = 1; });
    carveVessels(2);
  },
};

// Seconds a perfect virus would need from the entry wound to the exit: moving through open cells, chewing the rest
function fastestEscape() {
  const step = 1 / VIRUS_SPEED, cost = new Float32Array(N).fill(Infinity), done = new Uint8Array(N);
  cost[idx(start.x, start.z)] = 0;
  for (;;) {
    let c = -1;
    for (let i = 0; i < N; i++) if (!done[i] && cost[i] < Infinity && (c < 0 || cost[i] < cost[c])) c = i;
    if (c < 0 || c === idx(exit.x, exit.z)) break;
    done[c] = 1;
    const cx = c % GRID, cz = (c / GRID) | 0;
    for (const [dx, dz] of DIRS) {
      if (!inside(cx + dx, cz + dz)) continue;
      const n = idx(cx + dx, cz + dz);
      if (type[n] === WALL || done[n]) continue;
      const enter = type[n] === OPEN ? (acid[n] ? step / ACID_SLOW : step) : CHEW_TIME[type[n]] + step;
      cost[n] = Math.min(cost[n], cost[c] + enter);
    }
  }
  return cost[idx(exit.x, exit.z)];
}

// If walls cut the exit off, chew-able tissue replaces walls along an L-shaped path
function ensureReachable() {
  const seen = new Uint8Array(N), q = [idx(start.x, start.z)];
  seen[q[0]] = 1;
  while (q.length) {
    const c = q.pop(), cx = c % GRID, cz = (c / GRID) | 0;
    for (const [dx, dz] of DIRS) {
      const n = idx(cx + dx, cz + dz);
      if (inside(cx + dx, cz + dz) && !seen[n] && type[n] !== WALL) { seen[n] = 1; q.push(n); }
    }
  }
  if (seen[idx(exit.x, exit.z)]) return;
  let x = start.x, z = start.z;
  while (x !== exit.x || z !== exit.z) {
    if (x !== exit.x) x += Math.sign(exit.x - x); else z += Math.sign(exit.z - z);
    if (type[idx(x, z)] === WALL) type[idx(x, z)] = SOFT;
  }
}

function makeLevel(level) {
  theme = themeFor(level);
  chew.fill(0); vessel.fill(0); eaten.fill(0); fat.fill(0); acid.fill(0);
  const noise = makeNoise(5);
  for (let z = 0; z < GRID; z++) for (let x = 0; x < GRID; x++)
    type[idx(x, z)] = !interior(x, z) ? WALL : noise(x, z) > DENSE_THRESHOLD ? DENSE : SOFT;
  LAYOUTS[theme.layout](level);
  // Fat pockets: quick to chew, and the virus is hidden inside them
  const blobs = FAT_BLOBS + Math.floor((level - 1) / 2);
  for (let b = 0; b < blobs; b++)
    disc(randi(4, GRID - 5), randi(4, GRID - 5), rand(1.2, 1.9), i => {
      if (type[i] === WALL || type[i] === OPEN) return;
      type[i] = FAT; fat[i] = 1;
    });
  // Entry wound (start pocket) near the camera, exit capillary far away
  start = { x: 2, z: GRID - 3 };
  spawnCell = { x: 1, z: GRID - 2 };
  for (let z = start.z - 1; z <= start.z + 1; z++) for (let x = start.x - 1; x <= start.x + 1; x++) {
    const i = idx(x, z);
    type[i] = OPEN; vessel[i] = 0; eaten[i] = 1; fat[i] = 0; acid[i] = 0;
  }
  exit = { x: GRID - 3, z: 2 };
  for (let z = exit.z - 1; z <= exit.z + 1; z++) for (let x = exit.x - 1; x <= exit.x + 1; x++)
    if (type[idx(x, z)] === WALL && interior(x, z)) type[idx(x, z)] = SOFT;
  type[idx(exit.x, exit.z)] = OPEN; vessel[idx(exit.x, exit.z)] = 1; acid[idx(exit.x, exit.z)] = 0;
  // An easy first few bites: only soft tissue (and no acid) right round the entry wound
  disc(start.x, start.z, START_SOFT_RADIUS, i => {
    if (type[i] === DENSE || type[i] === WALL) type[i] = SOFT;
    acid[i] = 0;
  });
  ensureReachable();

  const tallPillars = theme.layout === 'villi';
  for (let i = 0; i < N; i++) {
    height[i] = type[i] === WALL ? 1.5
      : type[i] === DENSE ? (tallPillars ? rand(1.25, 1.6) : rand(1.0, 1.2))
      : type[i] === FAT ? rand(0.7, 0.85) : rand(0.85, 1.05);
  }
}

// Power-ups go in sealed one-cell cavities and in the vessels
function placePickups() {
  const far = (x, z) => Math.abs(x - start.x) + Math.abs(z - start.z) > 5 && Math.abs(x - exit.x) + Math.abs(z - exit.z) > 2;
  const free = i => ![...pickupAt.keys()].some(p => Math.abs(p % GRID - i % GRID) + Math.abs(((p / GRID) | 0) - ((i / GRID) | 0)) < 4);
  const pick = (test, count) => {
    const cells = [];
    for (let i = 0; i < N; i++) if (test(i) && far(i % GRID, (i / GRID) | 0)) cells.push(i);
    for (let k = 0, tries = 0; k < count && cells.length && tries < 200; tries++) {
      const i = cells[randi(0, cells.length - 1)];
      if (!free(i)) continue;
      addPickup(i, KINDS[randi(0, KINDS.length - 1)]);
      k++;
    }
  };
  pick(i => type[i] === SOFT || type[i] === DENSE, PICKUPS_IN_TISSUE);
  pick(i => vessel[i] && type[i] === OPEN, PICKUPS_IN_VESSELS);
}

// Antibodies track the decoy if there is one, nothing while the virus is hidden, else the virus
function trackTarget() {
  if (decoy) return decoy;
  if (isHidden()) return null;
  return virus;
}
const isHidden = () => power.cloak > 0 || fat[idx(virus.x, virus.z)] === 1;

function computeDist() {
  dist.fill(-1);
  const target = trackTarget();
  if (!target) return;
  const s = idx(target.x, target.z);
  let h = 0, t = 0;
  dist[s] = 0; bfsQueue[t++] = s;
  while (h < t) {
    const c = bfsQueue[h++], cx = c % GRID, cz = (c / GRID) | 0;
    for (const [dx, dz] of DIRS) {
      const nx = cx + dx, nz = cz + dz;
      if (!inside(nx, nz)) continue;
      const n = idx(nx, nz);
      if (type[n] !== OPEN || dist[n] >= 0) continue;
      dist[n] = dist[c] + 1; bfsQueue[t++] = n;
    }
  }
}

function setTissue(i, squash = 0, wobble = 0) {
  const x = i % GRID, z = (i / GRID) | 0;

    _p.y = height[i] * (1 - 0.65 * squash) - 0.03;
    _s.set(r, r * 0.4, r);

function setFloor(i) {

    nucleusSize[i] = type[i] === FAT ? rand(0.12, 0.18) : rand(0.26, 0.36);

    setTissue(i);

const rbcList = [];
function placeRbcs() {
  rbcList.length = 0;

  for (let i = 0; i < N; i++) if (vessel[i] && type[i] === OPEN) cells.push(i);
  const count = Math.min(RBC_MAX, Math.floor(cells.length / 2));

    const i = cells[randi(0, cells.length - 1)], x = i % GRID, z = (i / GRID) | 0;
    rbcList.push({ x, z, px: x + rand(-0.3, 0.3), pz: z + rand(-0.3, 0.3), tx: x, tz: z, last: -1, y: rand(0.15, 0.6),

function updateRbcs(dt, t) {

      const here = idx(r.x, r.z);

      if (opts.length > 1) opts = opts.filter(([x, z]) => idx(x, z) !== r.last);

// Lumpy sphere: a smooth wobble of the radius, the same for vertices that share a position
function lumpySphere(r, amount, seed) {
  const geo = new THREE.SphereGeometry(r, 36, 24);
  const p = geo.attributes.position, v = new THREE.Vector3();
  for (let k = 0; k < p.count; k++) {
    v.fromBufferAttribute(p, k);

    v.multiplyScalar(1 + n * amount);
    p.setXYZ(k, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  return geo;
}

// The virus: a spiky purple blob with devil horns, glowing eyes under angry brows, a toothy grin and little clawed arms.
// It faces +z (towards the camera); the spikes turn on their own around it.
function makeVirus({ body = 0x5a2290, emissive = 0x1a0630, spike = 0x9cff3a, eye = 0xff2a1a, light = 0x9cff5a } = {}) {
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshPhysicalMaterial({ color: body, emissive, roughness: 0.35, clearcoat: 0.8, clearcoatRoughness: 0.2, transparent: true });
  const spikeMat = new THREE.MeshStandardMaterial({ color: spike, emissive: spike, emissiveIntensity: 0.3, roughness: 0.4, transparent: true });
  const pupilMat = new THREE.MeshBasicMaterial({ color: eye, transparent: true });
  const hornMat = new THREE.MeshPhysicalMaterial({ color: 0x2a0a14, roughness: 0.25, clearcoat: 1, transparent: true });
  g.userData.mats = [bodyMat, spikeMat, pupilMat, hornMat];

  const R = 0.3;
  const bodyMesh = new THREE.Mesh(lumpySphere(R, 0.06, 1.7), bodyMat);
  bodyMesh.castShadow = true;
  g.add(bodyMesh);

  // Spikes everywhere except the face
  const spikes = new THREE.Group();
  const stalkGeo = new THREE.CylinderGeometry(0.022, 0.03, 0.14, 6);
  stalkGeo.translate(0, 0.07, 0);
  const COUNT = 26;
  for (let k = 0; k < COUNT; k++) {
    const y = 1 - 2 * (k + 0.5) / COUNT, r = Math.sqrt(1 - y * y), a = k * 2.399963;
    const dir = new THREE.Vector3(Math.cos(a) * r, y, Math.sin(a) * r);
    if (dir.z > 0.35 || dir.y > 0.8) continue;
    const s = new THREE.Group();
    s.add(new THREE.Mesh(stalkGeo, spikeMat), ball(spikeMat, 0.045, new THREE.Vector3(0, 0.15, 0)));
    s.position.copy(dir).multiplyScalar(R * 0.92);
    s.quaternion.setFromUnitVectors(_yAxis, dir);
    spikes.add(s);
  }
  g.add(spikes);

  // Horns
  for (const side of [-1, 1]) {
    const horn = new THREE.Mesh(coneGeo, hornMat);
    horn.scale.set(0.05, 0.17, 0.05);

function animateVirus(g, t, chewing, moving) {

const lerpAngle = (a, b, t) => a + Math.atan2(Math.sin(b - a), Math.cos(b - a)) * t;

// Walk cycle, staff waving, the "?" when they've lost the scent
function animateAntibody(a, dt, moved, hunting) {
  const u = a.mesh.userData;
  a.walk += moved * 11;
  const walking = moved > 1e-4;
  const swing = walking ? Math.sin(a.walk) : 0;
  u.legs[0].rotation.x = swing * 0.7;
  u.legs[1].rotation.x = -swing * 0.7;
  u.arms[0].rotation.x = -swing * 0.6;
  u.arms[1].rotation.x = hunting ? -0.5 + Math.sin(a.phase * 9) * 0.35 : -0.15 + swing * 0.2;
  u.bob.position.y = walking ? Math.abs(Math.sin(a.walk)) * 0.04 : Math.sin(a.phase * 2) * 0.01;
  u.bob.rotation.z = walking ? Math.sin(a.walk) * 0.06 : 0;
  u.question.visible = !hunting && a.grow >= 1;
  u.question.position.y = 1.0 + Math.sin(a.phase * 3) * 0.05;
  // Face where it's walking, or the virus when standing still
  const want = walking ? Math.atan2(a.dx, a.dz) : Math.atan2(virus.px - a.px, virus.pz - a.pz);
  a.yaw = lerpAngle(a.yaw, want, 1 - Math.exp(-dt * 10));
  a.mesh.rotation.y = a.yaw;
}

function setupOrganExtras() {
  acidCells.length = 0;
  for (let i = 0; i < N; i++) if (acid[i]) acidCells.push(i);
  acidCells.forEach((i, k) => acidMesh.setMatrixAt(k, _m.makeTranslation(i % GRID, 0.03, (i / GRID) | 0)));
  acidMesh.count = acidCells.length;
  acidMesh.instanceMatrix.needsUpdate = true;
  for (const b of bubbles) { b.life = 0; b.s.visible = false; }
  wallCells = [];
  if (theme.sparks) for (let i = 0; i < N; i++) if (type[i] === WALL && interior(i % GRID, (i / GRID) | 0)) wallCells.push(i);
  for (const sp of sparks) { sp.life = 0; sp.s.visible = false; }
}

function nextWall(cell, prev) {
  const cx = cell % GRID, cz = (cell / GRID) | 0;
  const opts = DIRS.map(([dx, dz]) => idx(cx + dx, cz + dz))
    .filter(n => n !== prev && type[n] === WALL && interior(n % GRID, (n / GRID) | 0));
  return opts.length ? opts[randi(0, opts.length - 1)] : -1;
}

function updateOrganExtras(dt, t) {
  if (acidCells.length) {
    acidMat.emissiveIntensity = 1.1 + Math.sin(t * 3) * 0.35;
    for (const b of bubbles) {
      if (b.life <= 0) {
        if (Math.random() < dt * 2) {
          const i = acidCells[randi(0, acidCells.length - 1)];
          b.s.position.set(i % GRID + rand(-0.4, 0.4), 0.08, ((i / GRID) | 0) + rand(-0.4, 0.4));
          b.life = rand(0.6, 1.4);
          b.s.visible = true;
        }
        continue;
      }
      b.life -= dt;
      b.s.position.y += dt * 0.35;
      b.s.scale.setScalar(0.12 + (1.4 - b.life) * 0.18);
      if (b.life <= 0) b.s.visible = false;
    }
  }
  if (wallCells.length) {
    for (const sp of sparks) {
      if (sp.life <= 0) {
        if (Math.random() < dt * 1.5) {
          sp.cell = wallCells[randi(0, wallCells.length - 1)];
          sp.prev = -1; sp.next = nextWall(sp.cell, -1); sp.t = 0;
          sp.life = sp.next < 0 ? 0 : rand(1, 2.5);
          sp.s.visible = sp.life > 0;
        }
        continue;
      }
      sp.life -= dt;
      sp.t += dt * 7;
      while (sp.t >= 1 && sp.life > 0) {
        sp.t -= 1;
        sp.prev = sp.cell; sp.cell = sp.next;
        sp.next = nextWall(sp.cell, sp.prev);
        if (sp.next < 0) sp.life = 0;
      }
      if (sp.life <= 0) { sp.s.visible = false; continue; }
      const ax = sp.cell % GRID, az = (sp.cell / GRID) | 0, bx = sp.next % GRID, bz = (sp.next / GRID) | 0;
      sp.s.position.set(lerp(ax, bx, sp.t), 1.6, lerp(az, bz, sp.t));
      sp.s.scale.setScalar(0.45 + Math.random() * 0.35);
    }
  }
}

let bitNext = 0;
function spawnBits(x, z, n) {
  for (let k = 0; k < n; k++) {
    const b = bits[bitNext++ % bits.length];
    b.m.position.set(x + rand(-0.3, 0.3), rand(0.3, 0.8), z + rand(-0.3, 0.3));
    b.vx = rand(-1.5, 1.5); b.vy = rand(1, 3); b.vz = rand(-1.5, 1.5);

function updateBits(dt) {
  for (const b of bits) {
    if (!b.m.visible) continue;
    b.life -= dt;
    if (b.life <= 0) { b.m.visible = false; continue; }
    b.vy -= 9 * dt;
    b.m.position.x += b.vx * dt; b.m.position.y = Math.max(0.05, b.m.position.y + b.vy * dt); b.m.position.z += b.vz * dt;
    b.m.scale.setScalar(Math.min(1, b.life * 3));
  }
}

const CLIP_TRIM = {           // per-clip level trims, measured so the clips sit at a similar loudness
  'sfx-whistle': 0.3, 'sfx-bump': 4, 'sfx-pop': 4, 'sfx-gulp': 1.6, 'sfx-heartbeat': 1.4, 'sfx-cloak': 0.6,
  'sfx-chomp2': 0.8, 'sfx-chomp3': 1.4, 'sfx-caught': 0.7, 'sfx-cackle': 0.7,
  'say-guard-there': 1.4, 'say-guard-fake': 1.2, 'music-chase': 0.7,
  'say-virus-escape': 0.75, 'say-virus-start-4': 0.75, 'say-virus-caught-3': 0.75, 'say-virus-power-3': 0.7,
  'say-virus-power-4': 0.7, 'say-virus-chew-2': 0.75, 'say-virus-bump-3': 0.75,
};
const MUSIC_END = { 'music-chase': 43.2 };   // seconds; the track goes quiet after this, so its loop ends here
// Spoken lines, grouped by the moment they're for; each time one variant is picked, never the one said last time
const VOICE = {};
for (const [g, n] of [['guard-halt', 5], ['guard-there', 5], ['guard-where', 4], ['guard-gotcha', 4], ['guard-fake', 4],
  ['virus-start', 4], ['virus-escape', 4], ['virus-caught', 4], ['virus-power', 4], ['virus-hide', 4]])
  VOICE[g] = Array.from({ length: n }, (_, k) => `say-${g}${k ? '-' + (k + 1) : ''}`);
for (const [g, n] of [['virus-chew', 4], ['virus-bump', 3]])
  VOICE[g] = Array.from({ length: n }, (_, k) => `say-${g}-${k + 1}`);
for (const o of ['muscle', 'lungs', 'gut', 'brain', 'bone', 'heart']) VOICE['virus-organ-' + o] = ['say-virus-organ-' + o];
const SAY = Object.values(VOICE).flat();
const CLIPS = [...SAY,
  ...['chomp1', 'chomp2', 'chomp3', 'gulp', 'bump', 'power', 'whistle', 'caught', 'cackle', 'heartbeat', 'pop', 'cloak'].map(n => 'sfx-' + n),
  'music-title', 'music-play', 'music-chase', 'sting-escape', 'sting-caught'];
const LOOPS = ['music-title', 'music-play', 'music-chase'];

const rawClips = {}, clips = {};
for (const n of CLIPS) rawClips[n] = fetch(`assets/${n}.mp3?v=${ASSET_V}`).then(r => r.ok ? r.arrayBuffer() : null).catch(() => null);

let ac = null, master = null, sfxBus = null, voiceBus = null, musicBus = null;
let muted = false;
try { muted = localStorage.getItem('virusescape.muted') === '1'; } catch {}

function audio() {
  if (!ac) {
    try { ac = new AudioContext(); } catch { return null; }
    master = ac.createGain(); master.gain.value = muted ? 0 : 1; master.connect(ac.destination);
    sfxBus = ac.createGain(); sfxBus.connect(master);
    voiceBus = ac.createGain(); voiceBus.connect(master);
    musicBus = ac.createGain(); musicBus.gain.value = MUSIC_VOL; musicBus.connect(master);
    for (const n of CLIPS) rawClips[n].then(b => b && new Promise((ok, no) => ac.decodeAudioData(b, ok, no)))
      .then(buf => { if (buf) clips[n] = LOOPS.includes(n) ? loopable(buf, MUSIC_END[n]) : buf; }).catch(() => {});
  }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}

function toggleMute() {
  muted = !muted;
  try { localStorage.setItem('virusescape.muted', muted ? '1' : '0'); } catch {}
  if (master) master.gain.setTargetAtTime(muted ? 0 : 1, ac.currentTime, 0.05);
  toast(muted ? '🔇 Sound off' : '🔊 Sound on', 1.2);
  showMute();
}
const showMute = () => { document.getElementById('bSound').textContent = muted ? '🔇' : '🔊'; };

// Cut a track at `end` seconds and blend its last MUSIC_XFADE seconds into its start (equal power)
function loopable(buf, end = buf.duration) {
  const X = Math.floor(MUSIC_XFADE * buf.sampleRate), L = Math.floor(end * buf.sampleRate) - X;
  const b = ac.createBuffer(buf.numberOfChannels, L, buf.sampleRate);
  for (let c = 0; c < buf.numberOfChannels; c++) {
    const d = buf.getChannelData(c), o = b.getChannelData(c);
    o.set(d.subarray(0, L));
    for (let i = 0; i < X; i++) { const u = i / X; o[i] = d[i] * Math.sin(u * Math.PI / 2) + d[L + i] * Math.cos(u * Math.PI / 2); }
  }
  return b;
}

// Plays a loaded clip; returns null if it isn't loaded, so the caller can synthesize instead
function clip(name, { vol = SFX_VOL, rate = 1, bus = sfxBus, delay = 0 } = {}) {
  const buf = clips[name];
  if (!ac || !buf) return null;
  const s = ac.createBufferSource(), g = ac.createGain();
  s.buffer = buf; s.playbackRate.value = rate;
  g.gain.value = vol * (CLIP_TRIM[name] ?? 1);
  s.connect(g).connect(bus);
  s.start(ac.currentTime + delay);
  return s;
}

function noiseBurst(dur, freq, gain) {
  const a = audio(); if (!a) return;
  const buf = a.createBuffer(1, Math.ceil(a.sampleRate * dur), a.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const src = a.createBufferSource(); src.buffer = buf;
  const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
  const g = a.createGain(); g.gain.value = gain;
  src.connect(f).connect(g).connect(sfxBus);
  src.start();
}
function tone(freq, dur, type = 'sine', gain = 0.15, slideTo = null, delay = 0) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + delay;
  const o = a.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  const g = a.createGain(); g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(sfxBus);
  o.start(t); o.stop(t + dur);
}

const sfx = {
  chomp: () => clip(`sfx-chomp${randi(1, 3)}`, { rate: rand(0.9, 1.15) }) || noiseBurst(0.09, rand(600, 1100), 0.35),
  gulp: () => clip('sfx-gulp', { rate: rand(0.95, 1.1) }) || tone(220, 0.15, 'sine', 0.2, 90),
  bump: () => clip('sfx-bump') || tone(110, 0.12, 'triangle', 0.15, 70),
  pop: () => clip('sfx-pop') || tone(300, 0.12, 'square', 0.08, 80),
  cloak: () => clip('sfx-cloak') || tone(900, 0.4, 'sine', 0.06, 300),
  spawn: () => clip('sfx-whistle') || (tone(880, 0.12, 'square', 0.05), tone(660, 0.15, 'square', 0.05, null, 0.12)),
  heartbeat: () => clip('sfx-heartbeat', { vol: HEART_VOL * Math.min(1.8, theme.beat) }) || (tone(62, 0.2, 'sine', 0.22, 40), tone(55, 0.16, 'sine', 0.14, 38, 0.25)),
  power: () => clip('sfx-power') || [660, 880, 1320].forEach((f, k) => tone(f, 0.18, 'sine', 0.14, null, k * 0.06)),
  caught: () => { clip('sfx-caught') || tone(440, 0.8, 'sawtooth', 0.12, 60); sting('sting-caught', 0.6); },
  escaped: () => {
    clip('sfx-cackle') || [523, 659, 784, 1047].forEach((f, k) => tone(f, 0.25, 'triangle', 0.15, null, k * 0.11));
    sting('sting-escape', 0.3);
  },
};

/* ======== voices: one line at a time, with the music ducked under it ======== */
let voiceBusyUntil = 0;
const voiceQueue = [], lastSaid = {}, lastVariant = {};
// group: a key of VOICE. force: say it even if that kind of line was said just now, ahead of anything queued
function say(group, { force = false } = {}) {
  if (!ac) return;
  let opts = VOICE[group].filter(n => clips[n]);
  if (!opts.length) return;
  const now = ac.currentTime;
  if (!force && now - (lastSaid[group] ?? -99) < (VOICE_GAP_LONG[group] ?? VOICE_GAP)) return;
  lastSaid[group] = now;
  if (opts.length > 1) opts = opts.filter(n => n !== lastVariant[group]);
  const name = opts[randi(0, opts.length - 1)];
  lastVariant[group] = name;
  if (force) voiceQueue.unshift(name); else if (voiceQueue.length < 2) voiceQueue.push(name);
  pumpVoice();
}
function pumpVoice() {
  if (!ac || !voiceQueue.length || ac.currentTime < voiceBusyUntil) return;
  const s = clip(voiceQueue.shift(), { vol: VOICE_VOL, bus: voiceBus });
  if (!s) return;
  voiceBusyUntil = ac.currentTime + s.buffer.duration;
  musicBus.gain.setTargetAtTime(MUSIC_VOL * MUSIC_DUCK, ac.currentTime, 0.08);
  s.onended = () => { musicBus.gain.setTargetAtTime(MUSIC_VOL, ac.currentTime, 0.3); pumpVoice(); };
}
function hushVoices() { voiceQueue.length = 0; }

/* ======== music: a title loop, a gameplay loop that crossfades into a chase loop as guards close in, stings ======== */
const music = {};             // loop name -> { src, gain }
let musicMode = 'title', chase = 0;
function sting(name, delay) {
  musicMode = 'none';
  clip(name, { vol: 1, bus: musicBus, delay });
}
// Every frame: start each loop once it's decoded and wanted, and ease its level toward where it should be
function updateMusic(dt, danger) {
  if (!ac) return;
  chase = lerp(chase, danger, 1 - Math.exp(-dt * 1.5));
  const want = {
    'music-title': musicMode === 'title' ? 1 : 0,
    'music-play': musicMode === 'play' ? 1 - chase : 0,
    'music-chase': musicMode === 'play' ? chase : 0,
  };
  for (const n of LOOPS) {
    let m = music[n];
    if (!m && want[n] > 0.01 && clips[n]) {
      const src = ac.createBufferSource(), gain = ac.createGain();
      src.buffer = clips[n]; src.loop = true;
      gain.gain.value = 0;
      src.connect(gain).connect(musicBus);
      src.start();
      m = music[n] = { src, gain };
    }
    if (m) m.gain.gain.setTargetAtTime(want[n] * (CLIP_TRIM[n] ?? 1), ac.currentTime, 0.25);
  }
}

/* ======== input ======== */
const $ = id => document.getElementById(id);
const KEYDIR = {
  ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1],
  ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0],
};
const held = [];
let tapped = null, tappedAt = 0;   // a quick tap is remembered until the next cell centre
const setTouch = on => document.body.classList.toggle('touch', on);
setTouch(TOUCH);
addEventListener('keydown', e => {
  if (KEYDIR[e.code] || e.code === 'Space') e.preventDefault();
  audio();
  setTouch(false);
  if (KEYDIR[e.code] && !held.includes(e.code)) held.push(e.code);
  if (KEYDIR[e.code] && !e.repeat) { tapped = KEYDIR[e.code]; tappedAt = performance.now(); }
  if (state === 'title' && KEYDIR[e.code]) next();
  else if ((state === 'caught' || state === 'escaped') && (e.code === 'Space' || e.code === 'Enter')) next();
  else if (e.code === 'KeyR') restart();
  if (e.code === 'KeyM' && !e.repeat) toggleMute();
});
addEventListener('keyup', e => {
  const k = held.indexOf(e.code);
  if (k >= 0) held.splice(k, 1);
});
addEventListener('blur', () => { held.length = 0; tapped = null; endStick(); });
// iOS only unlocks audio when a touch ends, so try again on every release
addEventListener('pointerup', () => audio());
function wantedDir() {
  if (held.length) return KEYDIR[held[held.length - 1]];
  if (stick.dir) return stick.dir;
  if (tapped && performance.now() - tappedAt < TAP_BUFFER * 1000) return tapped;
  return null;
}

// Touch (or mouse) stick: put a finger down anywhere and drag the way to go; keep holding to glide or chew.
// A quick swipe moves one cell, like a tapped key.
const stick = { id: null, ox: 0, oy: 0, dir: null };
canvas.addEventListener('pointerdown', e => {
  if (stick.id !== null || e.button > 0) return;
  audio();
  if (e.pointerType !== 'mouse') setTouch(true);
  Object.assign(stick, { id: e.pointerId, ox: e.clientX, oy: e.clientY, dir: null });
  try { canvas.setPointerCapture(e.pointerId); } catch {}
  $('stick').classList.add('on');
  drawStick(0, 0);
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerId !== stick.id) return;
  let dx = e.clientX - stick.ox, dy = e.clientY - stick.oy;
  const d = Math.hypot(dx, dy);
  if (d > STICK_RADIUS) {
    stick.ox += dx / d * (d - STICK_RADIUS); stick.oy += dy / d * (d - STICK_RADIUS);
    dx = e.clientX - stick.ox; dy = e.clientY - stick.oy;
  }
  let dir = null;
  if (d >= STICK_DEAD) {
    // The stronger axis wins, with a little stickiness so a wobbly thumb doesn't flip between two directions
    const ax = Math.abs(dx), ay = Math.abs(dy);
    const horiz = stick.dir ? (stick.dir[0] ? ax * 1.3 > ay : ax > ay * 1.3) : ax > ay;
    dir = horiz ? [Math.sign(dx), 0] : [0, Math.sign(dy)];
  }
  if (dir && !(stick.dir && dir[0] === stick.dir[0] && dir[1] === stick.dir[1])) { tapped = dir; tappedAt = performance.now(); }
  stick.dir = dir;
  drawStick(dx, dy);
});
canvas.addEventListener('pointerup', e => { if (e.pointerId === stick.id) endStick(); });
canvas.addEventListener('pointercancel', e => { if (e.pointerId === stick.id) endStick(); });
function endStick() {
  stick.id = null; stick.dir = null;
  $('stick').classList.remove('on');
}
function drawStick(dx, dy) {
  $('stick').style.transform = `translate(${stick.ox}px, ${stick.oy}px)`;
  $('knob').style.transform = `translate(${dx}px, ${dy}px)`;
}

// Buttons: the card's button, sound and restart. Blurred after a click so Space doesn't press them again.
$('card').addEventListener('click', e => { if (e.target.closest('.key')) next(); });
$('bSound').addEventListener('click', e => { audio(); toggleMute(); e.currentTarget.blur(); });
$('bRestart').addEventListener('click', e => { restart(); e.currentTarget.blur(); });

// Start, try again or go on, from the title, caught or escaped card
let cardReadyAt = 0;   // ignores presses right after a card appears, e.g. a finger still on the screen
function next() {
  if (performance.now() < cardReadyAt) return;
  if (state === 'escaped') level++;
  if (state !== 'title') newLevel();
  begin();
}
function restart() {
  if (state === 'play') { newLevel(); begin(); }
}

/* ======== game state ======== */
let state = 'title';
let level = 1;
let elapsed = 0, waveTimer = 0, eatenCount = 0, bumpCooldown = 0, chompTimer = 0, firstWaveDone = false;

function newLevel() {
  makeLevel(level);
  applyTheme();
  clearPickups();
  placePickups();
  placeRbcs();
  buildMeshes();
  setupOrganExtras();
  acidWarned = false;
  clearAntibodies();
  popDecoy();
  power.enzyme = power.atp = power.cloak = 0;
  tapped = null;
  Object.assign(virus, { x: start.x, z: start.z, fx: start.x, fz: start.z, px: start.x, pz: start.z, tx: start.x, tz: start.z,
    moving: false, chewing: -1, lunge: 0 });
  exitGroup.position.set(exit.x, 0, exit.z);
  computeDist();
  // Patrols waiting in the vessels, away from the entry wound
  const cells = [];
  for (let i = 0; i < N; i++) {
    const x = i % GRID, z = (i / GRID) | 0;
    if (vessel[i] && type[i] === OPEN && Math.abs(x - start.x) + Math.abs(z - start.z) > 10 && !(x === exit.x && z === exit.z)) cells.push(i);
  }
  for (let k = 0; k < PATROLS + level - 1 && cells.length; k++) {
    const i = cells.splice(randi(0, cells.length - 1), 1)[0];
    addAntibody(i % GRID, (i / GRID) | 0);
  }
  elapsed = 0; eatenCount = 0;
  waveTimer = Math.max(FIRST_WAVE_MIN, fastestEscape() * FIRST_WAVE_FRACTION);
  firstWaveDone = false;
  snapCamera();
}

function begin() {
  state = 'play';
  $('overlay').classList.add('hidden');
  $('bRestart').hidden = false;
  toast(`${theme.icon} Level ${level}: ${theme.name}`, 3);
  musicMode = 'play'; chase = 0; wasHidden = false;
  hushVoices();
  // On an organ's first visit the virus comments on it; after that it's a coin toss with the general lines
  sayWhenReady(level <= THEMES.length || Math.random() < 0.5 ? 'virus-organ-' + theme.key : 'virus-start', 3000);
}
// The first level starts on the key press that unlocks audio, before the clips are decoded: wait a moment for them
function sayWhenReady(name, within) {
  const until = performance.now() + within;
  const tryIt = () => { if (VOICE[name].some(n => clips[n])) say(name); else if (performance.now() < until) setTimeout(tryIt, 100); };
  tryIt();
}

function showCard(html) {
  $('card').innerHTML = html;
  $('card').scrollTop = 0;
  $('overlay').classList.remove('hidden');
  $('bRestart').hidden = true;
  cardReadyAt = performance.now() + 600;
  endStick();
}

let toastTimer = 0;
function toast(text, secs = 2) {
  $('toast').textContent = text;
  $('toast').classList.add('on');
  toastTimer = secs;
}

const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

/* ======== update: virus ======== */
function startMove(nx, nz) {
  virus.fx = virus.x; virus.fz = virus.z;
  virus.tx = nx; virus.tz = nz; virus.moving = true;
  virus.face = [nx - virus.x, nz - virus.z];
  tapped = null;   // a tap moves one cell
  stopChewing();
}

function stopChewing() {
  if (virus.chewing < 0) return;
  setTissue(virus.chewing, chew[virus.chewing]);
  tissue.instanceMatrix.needsUpdate = nuclei.instanceMatrix.needsUpdate = tissue.instanceColor.needsUpdate = true;
  virus.chewing = -1;
}

function arrive() {
  virus.px = virus.tx; virus.pz = virus.tz;
  virus.x = virus.tx; virus.z = virus.tz; virus.moving = false;
  const here = idx(virus.x, virus.z);
  if (!eaten[here]) { eaten[here] = 1; setFloor(here); floor.instanceColor.needsUpdate = true; }
  collectPickup(here);
  if (virus.x === exit.x && virus.z === exit.z) escaped();
}

function updateVirus(dt) {
  // Travel budget in cells; what's left at a cell centre carries on into the next move, so holding a key glides
  const inAcid = acid[idx(virus.x, virus.z)] || (virus.moving && acid[idx(virus.tx, virus.tz)]);
  if (inAcid && !acidWarned) { acidWarned = true; toast('🧪 Acid! You can only wade through it slowly', 2.2); }
  let budget = VIRUS_SPEED * (power.atp > 0 ? ATP_SPEED : 1) * (inAcid ? ACID_SLOW : 1) * dt;
  for (let guard = 0; guard < 3 && state === 'play'; guard++) {
    if (!virus.moving) { if (!decide(dt)) return; continue; }
    const dir = wantedDir();
    if (dir && dir[0] === -virus.face[0] && dir[1] === -virus.face[1]) {
      // Turn back at once instead of finishing the step
      [virus.tx, virus.fx] = [virus.fx, virus.tx];
      [virus.tz, virus.fz] = [virus.fz, virus.tz];
      virus.face = dir;
    }
    const dx = virus.tx - virus.px, dz = virus.tz - virus.pz, d = Math.hypot(dx, dz);
    if (d > budget) { virus.px += dx / d * budget; virus.pz += dz / d * budget; return; }
    budget -= d;
    arrive();
  }
}

// At a cell centre: move, chew or bump. Returns true when a move started.
function decide(dt) {
  const dir = wantedDir();
  if (!dir) { stopChewing(); return false; }
  virus.face = dir;
  const nx = virus.x + dir[0], nz = virus.z + dir[1];
  if (!inside(nx, nz)) return false;
  const c = idx(nx, nz);
  if (virus.chewing !== c) stopChewing();
  if (type[c] === OPEN) { startMove(nx, nz); return true; }
  if (type[c] === WALL) {
    if (bumpCooldown <= 0) { sfx.bump(); say('virus-bump'); bumpCooldown = 0.5; toast('Membrane: too tough to chew', 1.2); }
    return false;
  }
  // Chew
  virus.chewing = c;
  chew[c] += dt / (CHEW_TIME[type[c]] * (power.enzyme > 0 ? ENZYME_CHEW : 1));
  chompTimer -= dt;
  if (chompTimer <= 0) { sfx.chomp(); spawnBits(nx - dir[0] * 0.45, nz - dir[1] * 0.45, 2); chompTimer = 0.2; }
  if (chew[c] >= 1) {
    type[c] = OPEN; eaten[c] = 1; eatenCount++;
    virus.chewing = -1;
    setTissue(c); setFloor(c);
    tissue.instanceMatrix.needsUpdate = nuclei.instanceMatrix.needsUpdate = tissue.instanceColor.needsUpdate = floor.instanceColor.needsUpdate = true;
    spawnBits(nx, nz, 6); sfx.gulp();
    if (Math.random() < CHEW_TAUNT) say('virus-chew');
    startMove(nx, nz);
  } else {
    setTissue(c, chew[c], Math.sin(elapsed * 40) * 0.06 * chew[c]);
    tissue.instanceMatrix.needsUpdate = nuclei.instanceMatrix.needsUpdate = tissue.instanceColor.needsUpdate = true;
  }
  return false;
}

/* ======== update: antibodies ======== */
function updateAntibodies(dt) {
  const speed = AB_SPEED + AB_SPEED_PER_LEVEL * (level - 1);
  const target = trackTarget();
  let nearest = Infinity;
  danger = 0;
  // Slipping into hiding: a shimmer, a whisper, and the guards lose you
  const hidden = isHidden();
  if (hidden && !wasHidden) {
    if (fat[idx(virus.x, virus.z)]) { sfx.cloak(); say('virus-hide'); }
    if (antibodies.some(a => a.wasHunting)) say('guard-where');
  }
  wasHidden = hidden;
  for (const a of antibodies) {
    a.grow = Math.min(1, a.grow + dt * 2);
    const here = idx(a.x, a.z);
    const hunting = dist[here] >= 0;
    const v = hunting ? speed : speed * AB_WANDER_FACTOR;
    if (hunting && a.wasHunting === false && a.grow >= 1 && target === virus) say('guard-there');
    a.wasHunting = hunting;
    if (hunting && target === virus) danger = Math.max(danger, Math.min(1, (8 - dist[here]) / 5));

    if (!a.moving) {
      if (dist[here] === 0) {
        // Same cell as the target: go straight for it
        a.tx = target.px; a.tz = target.pz;
      } else if (hunting) {
        const opts = DIRS.map(([dx, dz]) => [a.x + dx, a.z + dz])
          .filter(([x, z]) => inside(x, z) && dist[idx(x, z)] === dist[here] - 1);
        const [x, z] = opts[randi(0, opts.length - 1)];
        a.last = here; a.x = x; a.z = z; a.tx = x; a.tz = z; a.moving = true;
      } else {
        let opts = DIRS.map(([dx, dz]) => [a.x + dx, a.z + dz])
          .filter(([x, z]) => inside(x, z) && type[idx(x, z)] === OPEN);
        if (opts.length > 1) opts = opts.filter(([x, z]) => idx(x, z) !== a.last);
        if (opts.length) {
          const [x, z] = opts[randi(0, opts.length - 1)];
          a.last = here; a.x = x; a.z = z; a.tx = x; a.tz = z; a.moving = true;
        }
      }
    }
    const dx = a.tx - a.px, dz = a.tz - a.pz, d = Math.hypot(dx, dz), step = v * dt;
    const moved = Math.min(d, step);
    if (d > 1e-4) { a.dx = dx; a.dz = dz; }
    if (d <= step) { a.px = a.tx; a.pz = a.tz; a.moving = false; }
    else { a.px += dx / d * step; a.pz += dz / d * step; }

    const toVirus = Math.hypot(a.px - virus.px, a.pz - virus.pz);
    nearest = Math.min(nearest, toVirus);
    if (toVirus < CATCH_DIST && a.grow >= 1) return caught();
    if (decoy && Math.hypot(a.px - decoy.px, a.pz - decoy.pz) < CATCH_DIST) { popDecoy(); sfx.pop(); say('guard-fake'); toast('Decoy popped!', 1.2); }

    // Look
    a.phase += dt;
    a.mesh.position.set(a.px, 0, a.pz);
    a.mesh.scale.setScalar(a.grow * 1.15);
    animateAntibody(a, dt, moved, hunting);
  }
  $('danger').style.opacity = Math.max(0, Math.min(0.85, (3.5 - nearest) / 3)).toFixed(2);
}

function updateWaves(dt) {
  waveTimer -= dt;
  if (waveTimer > 0) return;
  waveTimer = WAVE_EVERY;
  firstWaveDone = true;
  if (antibodies.length >= MAX_ANTIBODIES) return;
  addAntibody(spawnCell.x, spawnCell.z);
  sfx.spawn();
  say('guard-halt');
  toast('Antibodies on your trail!', 1.8);
}

/* ======== win / lose ======== */
const CREDIT = '<p class="credit">Voices and sounds: elevenlabs.io · Music: Eleven Music</p>';
function caught() {
  state = 'caught';
  sfx.caught();
  hushVoices();
  say('guard-gotcha', { force: true });
  say('virus-caught');
  setTimeout(() => { if (state !== 'play') musicMode = 'title'; }, 7000);
  showCard(`<h1 class="bad">Caught!</h1>
    <p>The antibodies tagged you after <b>${fmt(elapsed)}</b> and <b>${eatenCount}</b> cells chewed.</p>
    <button type="button" class="key"><span class="kb">Space: try again</span><span class="tc">↻ Try again</span></button>${CREDIT}`);
}
function escaped() {
  state = 'escaped';
  sfx.escaped();
  hushVoices();
  say('virus-escape', { force: true });
  setTimeout(() => { if (state !== 'play') musicMode = 'title'; }, 8000);
  showCard(`<h1>Escaped!</h1>
    <p>You slipped into the bloodstream in <b>${fmt(elapsed)}</b>, chewing <b>${eatenCount}</b> cells.</p>
    <p>Next, level ${level + 1}: <b>${themeFor(level + 1).icon} ${themeFor(level + 1).name}</b>. ${themeFor(level + 1).blurb}</p>
    <button type="button" class="key"><span class="kb">Space: next level</span><span class="tc">▶ Next level</span></button>${CREDIT}`);
}

/* ======== power-up timers ======== */
function updatePowers(dt) {
  for (const k in power) {
    if (power[k] <= 0) continue;
    power[k] -= dt;
    if (power[k] <= 0) toast(`${POWERS[k].icon} wore off`, 1.2);
  }
  if (decoy && (decoy.t -= dt) <= 0) popDecoy();
}

let powerHudText = '';
function updatePowerHud() {
  const parts = Object.keys(power).filter(k => power[k] > 0).map(k => `${POWERS[k].icon} ${Math.ceil(power[k])}`);
  if (decoy) parts.push(`${POWERS.decoy.icon} ${Math.ceil(decoy.t)}`);
  if (fat[idx(virus.x, virus.z)]) parts.push('🧈 hidden');
  const text = parts.join('  ');
  if (text === powerHudText) return;
  powerHudText = text;
  $('hPower').textContent = text;
  $('hPower').hidden = !text;
}

/* ======== camera and minimap ======== */
const camTarget = new THREE.Vector3();
function snapCamera() {
  camTarget.set(virus.px, 0, virus.pz - 1.5);
  camera.position.copy(CAM_OFFSET).multiplyScalar(camZoom).add(camTarget);
  camera.lookAt(camTarget);
}
function updateCamera(dt) {
  const k = 1 - Math.exp(-dt * 5);
  camTarget.lerp(_p.set(virus.px, 0, virus.pz - 1.5), k);
  camera.position.copy(CAM_OFFSET).multiplyScalar(camZoom).add(camTarget);
  camera.lookAt(camTarget);
  sun.position.set(virus.px + 6, 14, virus.pz + 4);
  sun.target.position.set(virus.px, 0, virus.pz);
}

const mm = $('minimap').getContext('2d');
const MM = 186 / GRID;
const MM_COL = { [OPEN]: '#5a2030', [SOFT]: '#c9707f', [DENSE]: '#8a3a50', [WALL]: '#3a2c50', [FAT]: '#e8cf7a' };
function drawMinimap() {
  mm.clearRect(0, 0, 186, 186);
  for (let i = 0; i < N; i++) {
    mm.fillStyle = type[i] === OPEN ? (fat[i] ? '#9a8a40' : eaten[i] ? '#3d6a2c' : acid[i] ? '#7aff3a' : vessel[i] ? MM_COL.lane : MM_COL[OPEN]) : MM_COL[type[i]];
    mm.fillRect((i % GRID) * MM, ((i / GRID) | 0) * MM, MM + 0.5, MM + 0.5);
  }
  const dot = (x, z, col, r) => { mm.fillStyle = col; mm.beginPath(); mm.arc((x + 0.5) * MM, (z + 0.5) * MM, r, 0, 7); mm.fill(); };
  dot(exit.x, exit.z, (performance.now() / 300 | 0) % 2 ? '#fff' : '#ff5a6e', 4);
  for (const [i, p] of pickupAt) dot(i % GRID, (i / GRID) | 0, '#' + POWERS[p.kind].color.toString(16).padStart(6, '0'), 2.5);
  if (decoy) dot(decoy.px, decoy.pz, '#ffa040', 3);
  for (const a of antibodies) dot(a.px, a.pz, '#8fc8ff', 3);
  dot(virus.px, virus.pz, '#9cff5a', 3.5);
}

/* ======== main loop ======== */
const clock = new THREE.Clock();
let mmTimer = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  if (state === 'play') {
    elapsed += dt;
    bumpCooldown -= dt;
    updatePowers(dt);
    updateVirus(dt);
    computeDist();
    if (state === 'play') updateAntibodies(dt);
    if (state === 'play') updateWaves(dt);
    $('hTime').textContent = fmt(elapsed);
    $('hEaten').textContent = eatenCount;
    $('hAb').textContent = antibodies.length;
    $('hWave').hidden = firstWaveDone;
    if (!firstWaveDone) $('hWaveT').textContent = fmt(Math.ceil(waveTimer));
    updatePowerHud();
  }
  if (toastTimer > 0 && (toastTimer -= dt) <= 0) $('toast').classList.remove('on');
  updateBits(dt);

  // Hidden virus fades out; pickups and decoy bob about
  const fade = state === 'play' && isHidden() ? 0.35 : 1;
  for (const m of virusMesh.userData.mats) m.opacity = lerp(m.opacity, fade, 1 - Math.exp(-dt * 8));
  for (const p of pickupAt.values()) {
    p.mesh.userData.gem.rotation.y += dt * 2;
    p.mesh.position.y = 0.45 + Math.sin(t * 3 + p.mesh.position.x) * 0.08;
  }
  if (decoy) {
    decoyMesh.position.set(decoy.px, 0.45 + Math.abs(Math.sin(t * 6)) * 0.15, decoy.pz);
    decoyMesh.rotation.y = Math.sin(t * 4) * 0.6;
    animateVirus(decoyMesh, t, false, true);
  }

  // Virus look: face where it's going (three-quarter view when heading away), grin at the camera when idle,
  // lunge into tissue while chewing
  const chewing = virus.chewing >= 0 && state === 'play';
  const busy = chewing || virus.moving;
  idleTime = busy ? 0 : idleTime + dt;
  if (virus.face[0]) virus.side = virus.face[0];
  const wantYaw = idleTime > 0.6 ? 0 : virus.face[1] < 0 ? Math.PI - 0.7 * virus.side : Math.atan2(virus.face[0], virus.face[1]);
  virus.yaw = lerpAngle(virus.yaw, wantYaw, 1 - Math.exp(-dt * 12));
  virus.lunge = lerp(virus.lunge, chewing ? 0.18 + Math.sin(t * 28) * 0.08 : 0, 1 - Math.exp(-dt * 15));
  virusMesh.position.set(virus.px + virus.face[0] * virus.lunge, 0.5 + Math.sin(t * 3) * 0.05, virus.pz + virus.face[1] * virus.lunge);
  virusMesh.rotation.set(chewing ? 0.25 : virus.moving ? 0.15 : 0, virus.yaw, 0);
  const pulse = 1 + Math.sin(t * (chewing ? 20 : 4)) * (chewing ? 0.06 : 0.03);
  virusMesh.scale.setScalar(pulse * VIRUS_SCALE);
  animateVirus(virusMesh, t, chewing, virus.moving);

  // Heartbeat: tissue swell, floor glow, a soft lub-dub while playing
  const beat = heartbeat(t);
  beatUniform.value = beat * theme.beat;
  floorMat.emissiveIntensity = beat * 0.35 * Math.min(1.5, theme.beat);
  const beatPhase = t % HEART_PERIOD;
  if (state === 'play' && ac) {
    if (beatPhase < lastBeatPhase) sfx.heartbeat();
  }
  lastBeatPhase = beatPhase;

  exitRing.scale.setScalar(1 + Math.sin(t * 4) * 0.12);
  exitLight.intensity = 5 + Math.sin(t * 4) * 2;
  updateMotes(dt, t);
  updateRbcs(dt, t);
  updateOrganExtras(dt, t);
  updateMusic(dt, state === 'play' ? danger : 0);

  updateCamera(dt);
  if ((mmTimer -= dt) <= 0) { drawMinimap(); mmTimer = 0.1; }
  composer.render();
  requestAnimationFrame(frame);
}
let idleTime = 0, lastBeatPhase = 0, danger = 0, wasHidden = false, acidWarned = false;

// ?debug exposes the game state on window.ve for testing in the console
if (new URLSearchParams(location.search).has('debug')) {
  window.ve = { virus, antibodies, power, pickupAt, type, fat, dist, idx, collectPickup, get decoy() { return decoy; },
    get state() { return state; }, get waveTimer() { return waveTimer; }, fastestEscape, isHidden, cam: CAM_OFFSET, setLevel: n => { level = n; newLevel(); begin(); },
    get audio() { return { ctx: ac?.state, loaded: Object.keys(clips).length, of: CLIPS.length, musicMode, chase, playing: Object.keys(music) }; }, step: dt => { updatePowers(dt); updateVirus(dt); computeDist(); updateAntibodies(dt); } };
}

newLevel();
showCard(`<h1>Virus Escape</h1>
  <p>You're a virus inside the body. <b>Chew through tissue</b> to reach the glowing capillary and escape into the bloodstream.</p>
  <p>Antibodies follow your tunnels, and more come in through your entry wound. Red vessels are fast lanes, but patrols lurk there. Purple membranes can't be chewed.</p>
  <p>Hide in <b>yellow fat</b> and they lose your scent. Grab glowing gems: ⚡ super chewing, 💨 speed, 👻 cloak, 🎈 decoy.</p>
  <p>Escape six organs: 💪 muscle, 🫁 lungs, 🍲 gut, 🧠 brain, 🦴 bone and ❤️ heart.</p>
  <p class="tc">👆 Drag anywhere on the screen to steer, and keep holding against tissue to chew it.</p>
  <button type="button" class="key"><span class="kb">Arrow keys / WASD to start</span><span class="tc">▶ Play</span></button>${CREDIT}`);
showMute();
frame();
</script>
